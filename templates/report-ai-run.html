<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AI 执行详情</title>
<link rel="stylesheet" href="./assets/report.css" />
</head>
<body class="subpage">

<header class="subpage-header">
  <h2>AI 执行详情</h2>
  <div class="filters">
    <input type="search" id="q" placeholder="搜索 ID / 名称 / 原因…" />
    <select id="filter-module"><option value="">全部模块</option></select>
    <select id="filter-type">
      <option value="">全部类型</option>
      <option>功能</option><option>边界</option><option>异常</option>
    </select>
    <select id="filter-status">
      <option value="">全部状态</option>
      <option>passed</option><option>failed</option><option>blocked</option><option>skipped</option>
    </select>
    <button id="only-attention" class="chip" type="button">仅看待处理（失败+阻塞）</button>
  </div>
</header>

<table class="case-table">
  <thead>
    <tr>
      <th></th>
      <th>用例 ID</th>
      <th>名称</th>
      <th>模块</th>
      <th>类型</th>
      <th>优先</th>
      <th>状态</th>
      <th>原因 / 备注</th>
      <th>用时</th>
      <th>PW</th>
    </tr>
  </thead>
  <tbody id="case-rows"></tbody>
</table>

<script src="./assets/report.js"></script>
<script>
  window.__AI_CASES__ = /* @AI_CASES_JSON@ */ [];
  if (window.AI_REPORT) window.AI_REPORT.render();
</script>
</body>
</html>
